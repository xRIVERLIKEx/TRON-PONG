<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tron Pong: Grid Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #00050a;
            color: #00f2ff;
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.5));
        }
        .retro-text {
            font-family: 'Share Tech Mono', monospace;
        }
        .neon-border {
            border: 2px solid #00f2ff;
            box-shadow: 0 0 15px #00f2ff, inset 0 0 15px #00f2ff;
        }
        .neon-border-pink {
            border: 2px solid #ff00f2;
            box-shadow: 0 0 15px #ff00f2, inset 0 0 15px #ff00f2;
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 10;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(0, 242, 255, 0.05) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
        }
        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "peerjs": "https://esm.sh/peerjs@^1.5.5",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <!-- Vite requires a root-relative path (/index.tsx) to correctly bundle the app for production. 
         Vite will replace this tag with the bundled JS file in the 'dist' folder. -->
    <script type="module" src="/index.tsx"></script>
</body>
</html>
